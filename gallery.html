<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .gallery-item-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-item-caption {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <h1>Gallery</h1>
    <div class="gallery">
        <div class="gallery-item">
            <img src="image1.jpg" alt="Gallery image 1">
            <div class="gallery-item-caption">Image 1</div>
        </div>
        <div class="gallery-item">
            <img src="image2.jpg" alt="Gallery image 2">
            <div class="gallery-item-caption">Image 2</div>
        </div>
        <div class="gallery-item">
            <img src="image3.jpg" alt="Gallery image 3">
            <div class="gallery-item-caption">Image 3</div>
        </div>
        <div class="gallery-item">
            <img src="image4.jpg" alt="Gallery image 4">
            <div class="gallery-item-caption">Image 4</div>
        </div>
    </div>
</body>
</html>
